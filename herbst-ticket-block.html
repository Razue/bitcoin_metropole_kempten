<!-- Bitcoin Herbst 2026 Ticket-Block -->
<section id="bitcoin-herbst" class="bitcoin-herbst-section">
  <div class="container">
    <div class="bitcoin-herbst-card">
      <div class="herbst-header">
        <span class="herbst-badge">🔥 Event</span>
        <h2 class="herbst-title">Bitcoin Herbst 2026</h2>
        <p class="herbst-date">20.–21. November 2026 · Kempten</p>
      </div>

      <div class="herbst-availability" id="herbst-availability">
        <span class="herbst-available" id="herbst-available-count">50</span>
        <span class="herbst-available-label">Plätze verfügbar</span>
        <span class="herbst-total">von 50</span>
      </div>

      <div class="herbst-price">
        <span class="herbst-price-amount">100.000</span>
        <span class="herbst-price-unit">sats</span>
        <span class="herbst-price-div">/ Ticket</span>
      </div>

      <form id="herbst-ticket-form" class="herbst-form" novalidate>
        <div class="herbst-form-group">
          <label for="herbst-name">Name</label>
          <input type="text" id="herbst-name" name="name" required
                 placeholder="Max Mustermann" autocomplete="name" maxlength="100">
          <span class="herbst-error" id="herbst-error-name" role="alert"></span>
        </div>

        <div class="herbst-form-group">
          <label for="herbst-email">E-Mail</label>
          <input type="email" id="herbst-email" name="email" required
                 placeholder="max@example.com" autocomplete="email" maxlength="200">
          <span class="herbst-error" id="herbst-error-email" role="alert"></span>
        </div>

        <div class="herbst-form-group">
          <label for="herbst-quantity">Anzahl Tickets</label>
          <select id="herbst-quantity" name="quantity">
            <option value="1">1 Ticket</option>
            <option value="2">2 Tickets</option>
            <option value="3">3 Tickets</option>
            <option value="4">4 Tickets</option>
            <option value="5">5 Tickets</option>
          </select>
          <span class="herbst-error" id="herbst-error-quantity" role="alert"></span>
        </div>

        <div class="herbst-total" id="herbst-total">
          Gesamt: <strong>100.000 sats</strong>
        </div>

        <button type="submit" class="btn btn-primary btn-herst" id="herbst-cta">
          Ticket sichern
        </button>

        <div class="herbst-status" id="herbst-status" role="status" aria-live="polite"></div>
      </form>

      <div class="herbst-footer">
        <p>Bezahlung via BTCPay · Bitcoin & Lightning</p>
        <p>Keine Daten werden öffentlich angezeigt</p>
      </div>
    </div>
  </div>
</section>
